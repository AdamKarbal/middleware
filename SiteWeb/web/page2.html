<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Itinéraire</title>
  <link rel="stylesheet" href="/css/page2.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header>
    <mon-burgermenu></mon-burgermenu>
  </header>

  <div class="page-container">
    <aside class="sidebar">
      <h3>Modifier l'itinéraire</h3>
      <mon-itineraire></mon-itineraire>
      <div class="current-itinerary">
        <h4>Itinéraire actuel</h4>
        <p>Départ : <span id="current-start">...</span></p>
        <p>Arrivée : <span id="current-end">...</span></p>
        <p>Distance totale : <span id="total-distance">...</span></p>
        <p>Durée totale : <span id="total-duration">...</span></p>

      </div>
    </aside>
    <main class="main-content">
      <mon-tabs>
        <div slot="tab-map">
          <h2>Carte</h2>
          <div class="map-container">
            <div id="map"></div>
            <div id="notification-area"></div>
          </div>
        </div>
        <div slot="tab-details">
          <h2>Détails</h2>
          <div class="details-container" id="details-container">
            <p>Recherche de l'itinéraire en cours...</p>
          </div>
        </div>
      </mon-tabs>
    </main>

  </div>
  <footer>
    <mon-footer></mon-footer>
  </footer>

  <script src="js/itineraire.js" defer></script>
  <script src="js/burgermenu.js" defer></script>
  <script src="js/footer.js" defer></script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

  <script src="js/page2.js" defer></script>
</body>
</html>
